name: home_admin
description: "HomeAdmin - 个人管理后台 App"
publish_to: 'none'
version: 1.8.0+2010
environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.0
  file_picker: ^8.3.7
  path_provider: ^2.1.0
  flutter_markdown: ^0.7.4+3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  markdown: ^7.2.2
  webview_flutter: ^4.13.1
  # Android 保活：前台服务（常驻通知 + 独立 isolate）
  flutter_foreground_task: ^10.0.0
  # 收到新通知时弹系统本地通知
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
