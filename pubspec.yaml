name: home_admin
description: "Atrium - 个人管理后台 App"
publish_to: 'none'
version: 1.10.0+2016
environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.0
  file_picker: ^8.3.7
  path_provider: ^2.1.0
  flutter_markdown: ^0.7.4+3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  markdown: ^7.2.2
  webview_flutter: ^4.13.1
  # OAuth2 PKCE：code_challenge 的 S256（SHA-256）计算
  crypto: ^3.0.7
  # OAuth2 令牌存系统安全存储（Android Keystore / iOS Keychain）
  # 锁 10.3.4：11.x 依赖 win32 ^6，与 file_picker 8.3.7 的 win32 ^5 冲突
  flutter_secure_storage: ^10.3.4
  # Android 保活：前台服务（常驻通知 + 独立 isolate）
  flutter_foreground_task: ^10.0.0
  # 收到新通知时弹系统本地通知
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
